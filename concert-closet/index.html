<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Concert Closet</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a theatre stage (student in a spotlight) beside a wardrobe closet, under a curtain valance. Single warm theme on purpose. */
:root{
  --curtain:#6E1A26; --curtain-deep:#43101A; --stage:#24140F; --wood:#8B5A32; --wood-light:#A8733F;
  --paper:#FBF4E3; --paper-2:#F2E5C8; --ink:#2B1D14; --muted:#6F5C4B; --line:#E0CFAE;
  --accent:#C2541A; --gold:#D4A017; --good:#2F7A3A; --bad:#B3261E; --white:#FFFDF7;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--stage)}
body{font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header valance */
.valance{background:linear-gradient(180deg,var(--curtain-deep),var(--curtain));position:relative;padding-block:14px 26px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.valance::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:16px;
  background:radial-gradient(circle at 18px 0,var(--curtain) 17px,transparent 18px) 0 0/36px 16px repeat-x}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.valance .eyebrow{color:#F1C77A}
h1{font-family:var(--display);font-weight:800;color:var(--white);font-size:clamp(2rem,5vw,3rem);line-height:1;margin:2px 0 0;letter-spacing:.01em}
.hud{display:flex;gap:8px;align-items:center}
.pill{background:rgba(0,0,0,.28);color:var(--white);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem}
.pill .star{color:var(--gold)}

main{max-width:1180px;margin:0 auto;padding-block:30px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.panel{background:var(--paper);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:1.9rem}
h3{font-size:1.35rem}
h4{font-size:1.05rem;margin-top:14px;margin-bottom:6px}

/* dress code card */
.memo{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0 0;font-size:.95rem}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.sw{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700}
.sw i{width:20px;height:20px;border-radius:6px;flex:none;border:1px solid rgba(0,0,0,.15)}
.wear{margin:0;padding-left:18px;font-size:.93rem}
.wear li{margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#F7DCD6;color:#7E1A12;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.82rem}
.small{font-size:.85rem;color:var(--muted);margin:6px 0 0}

/* start */
.start{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
.start .lead{font-size:1.1rem;margin:10px 0 0}
.steps{display:grid;gap:10px;margin:18px 0}
.step{display:flex;gap:12px;align-items:flex-start}
.step b.n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--white);display:grid;place-items:center;font-family:var(--display);font-size:1.1rem}
label.lbl{font-weight:800;display:block;margin:6px 0 6px}
.namebox{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{font:inherit;font-size:1.1rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--white);color:var(--ink);flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:800;font-size:1.1rem;background:var(--accent);color:var(--white);box-shadow:0 4px 0 #7D3410;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7D3410}
.btn.green{background:var(--good);box-shadow:0 4px 0 #1B4A22}
.btn.ghost{background:var(--paper-2);color:var(--ink);box-shadow:0 4px 0 #CDB88F}
.start-figs{display:flex;justify-content:center;gap:4px;margin-top:6px}
.start-figs svg{width:90px;height:auto}

/* game */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px;align-items:start}
.stagecol{display:grid;gap:14px;position:sticky;top:12px}
.progress{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);color:var(--white);font-size:.7rem;font-weight:800;display:grid;place-items:center}
.dot.done{background:var(--gold);color:var(--ink)}
.dot.now{outline:3px solid var(--gold);background:rgba(212,160,23,.25)}
.stage{position:relative;border-radius:18px;overflow:hidden;min-height:420px;
  background:radial-gradient(ellipse 55% 70% at 50% 18%,rgba(255,228,160,.42),transparent 70%),linear-gradient(180deg,#3A1A17 0%,#2A1412 72%,var(--wood) 72%,var(--wood-light) 100%);
  box-shadow:inset 0 0 0 4px var(--curtain-deep),0 10px 30px rgba(0,0,0,.4)}
.stage::before,.stage::after{content:"";position:absolute;top:0;bottom:28%;width:13%;background:repeating-linear-gradient(90deg,var(--curtain) 0 10px,var(--curtain-deep) 10px 16px);z-index:1}
.stage::before{left:0;border-bottom-right-radius:60% 30%}
.stage::after{right:0;border-bottom-left-radius:60% 30%}
.figwrap{position:relative;z-index:2;display:flex;justify-content:center;padding-top:18px}
.figwrap svg{height:360px;width:auto;max-width:100%}
.nameplate{position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--wood);border-radius:10px;padding:2px 18px;font-family:var(--display);font-weight:800;font-size:1.3rem;white-space:nowrap}
.goal{background:var(--paper);border-radius:16px;padding:14px 18px;border-left:8px solid var(--gold)}
.goal .eyebrow{color:var(--accent)}
.goal p{margin:4px 0 0;font-size:1.12rem;font-weight:700}

.closetcol{display:grid;gap:14px;min-width:0}
details.code{background:var(--paper);border-radius:16px;padding:12px 18px}
details.code summary{font-family:var(--display);font-weight:800;font-size:1.2rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.code summary::-webkit-details-marker{display:none}
details.code summary::after{content:"Show";font-family:var(--body);font-size:.85rem;background:var(--paper-2);padding:2px 10px;border-radius:999px}
details.code[open] summary::after{content:"Hide"}
.closet{background:linear-gradient(180deg,#F5E9CF,#EEDDBA);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:6px solid var(--wood)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tab{border:0;border-radius:12px;padding:9px 6px;font-weight:800;font-size:.95rem;background:rgba(139,90,50,.15);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected=true]{background:var(--wood);color:var(--white)}
.tab .tick{width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;font-size:.7rem;display:grid;place-items:center}
.note{background:var(--white);border-radius:10px;padding:8px 12px;font-size:.92rem;font-weight:700;margin-bottom:10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.item{position:relative;border:3px solid transparent;background:var(--white);border-radius:14px;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.08);transition:transform .1s}
.item:hover{transform:translateY(-2px)}
.item svg{width:100%;height:84px}
.item span{font-weight:800;font-size:.85rem;line-height:1.15;text-align:center;min-height:2.3em}
.item[aria-pressed=true]{border-color:var(--gold);background:#FFF5D6}
.item[aria-pressed=true]::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:800;display:grid;place-items:center;font-size:.8rem}
.checkrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.checkrow .btn{flex:1}

/* feedback */
.fb{position:absolute;inset:10px;z-index:6;background:var(--paper);border-radius:14px;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.fb h3{display:flex;align-items:center;gap:8px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--white);border-radius:10px;padding:6px 10px;border-left:6px solid var(--good)}
.row.no{border-left-color:var(--bad)}
.row svg{width:44px;height:40px}
.row .mark{font-weight:800}
.row.ok .mark{color:var(--good)}
.row.no .mark{color:var(--bad)}
.row p{margin:0;font-size:.9rem}
.goalrow{display:grid;grid-template-columns:44px 1fr}
.goalrow .gi{font-size:1.5rem;text-align:center}
.bigstars{font-size:2.2rem;letter-spacing:4px;color:var(--gold);text-align:center;line-height:1}
.bigstars .off{color:#D9C9A6}
.fb .btn{align-self:stretch}

/* leaves */
.leaf{position:absolute;top:-20px;z-index:7;width:16px;height:16px;border-radius:0 80% 0 80%;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(480px) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.leaf{display:none}.item{transition:none}}

/* end */
.cert{text-align:center;border:6px double var(--gold)}
.cert .who{font-family:var(--display);font-size:clamp(2rem,6vw,3.2rem);color:var(--accent);line-height:1.05;margin:6px 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:18px}
.gcard{background:var(--white);border-radius:14px;padding:8px;text-align:center}
.gcard svg{width:100%;height:170px}
.gcard b{display:block;font-family:var(--display);font-size:1.1rem}
.gcard .s{color:var(--gold);font-size:1rem}

@media (max-width:860px){
  .start,.game{grid-template-columns:1fr}
  .stagecol{position:static}
  .stage{min-height:330px}
  .figwrap svg{height:280px}
}
</style>

<header class="valance">
  <div class="hwrap">
    <div>
      <div class="eyebrow">Grandparents Day Performance · Friday, November 20</div>
      <h1>Concert Closet</h1>
    </div>
    <div class="hud">
      <span class="pill" id="starPill"><span class="star">★</span> <span id="starCount">0</span></span>
      <button class="pill" id="muteBtn" type="button" aria-pressed="false">🔊 Sound</button>
    </div>
  </div>
</header>
<main id="app"></main>

<script>
const COLORS={
  burgundy:{name:'Burgundy',hex:'#7B1E2B',fall:true},
  rust:{name:'Rust',hex:'#B5502D',fall:true},
  burntOrange:{name:'Burnt Orange',hex:'#CC5500',fall:true},
  mustard:{name:'Mustard Yellow',hex:'#D4A017',fall:true},
  olive:{name:'Olive Green',hex:'#6B7A2A',fall:true},
  forest:{name:'Forest Green',hex:'#2E5E3A',fall:true},
  brown:{name:'Brown',hex:'#6B4226',fall:true},
  cream:{name:'Cream',hex:'#F3E7C9',fall:true},
  beige:{name:'Beige',hex:'#D6BF98',fall:true},
  neonPink:{name:'Neon Pink',hex:'#FF2EC4',neon:true},
  neonGreen:{name:'Neon Green',hex:'#45F01A',neon:true},
  neonYellow:{name:'Neon Yellow',hex:'#E8FF1F',neon:true},
  skyBlue:{name:'Sky Blue',hex:'#69B8F0'},
  lavender:{name:'Lavender',hex:'#B49AE6'},
  denim:{name:'Blue',hex:'#4A72B0'}
};
const KINDS={
  dressShirt:{cat:'top',name:'Dress Shirt',ok:true,why:'Dress shirts are on the list of tops.'},
  blouse:{cat:'top',name:'Blouse',ok:true,why:'Blouses are on the list of tops.'},
  sweater:{cat:'top',name:'Sweater',ok:true,why:'Sweaters are on the list of tops.'},
  dress:{cat:'top',name:'Dress',ok:true,why:'Dresses are allowed, and you don\'t need a bottom with one.'},
  graphicTee:{cat:'top',name:'Graphic T-Shirt',ok:false,why:'Graphic T-shirts are on the "Please avoid" list.'},
  jersey:{cat:'top',name:'Sports Jersey',ok:false,why:'A sports jersey is athletic wear, which is on the "Please avoid" list.'},
  pajamaTop:{cat:'top',name:'Pajama Top',ok:false,why:'Pajamas are on the "Please avoid" list.'},
  dressPants:{cat:'bottom',name:'Dress Pants',ok:true,why:'Dress pants are on the list of bottoms.'},
  skirt:{cat:'bottom',name:'Skirt',ok:true,why:'Skirts are on the list of bottoms.'},
  jeans:{cat:'bottom',name:'Jeans',ok:false,why:'Jeans are on the "Please avoid" list.'},
  sweatpants:{cat:'bottom',name:'Sweatpants',ok:false,why:'Sweatpants are athletic wear, which is on the "Please avoid" list.'},
  pajamaPants:{cat:'bottom',name:'Pajama Pants',ok:false,why:'Pajamas are on the "Please avoid" list.'},
  dressShoes:{cat:'shoes',name:'Dress Shoes',ok:true,why:'Dress shoes are on the shoe list.'},
  flats:{cat:'shoes',name:'Flats',ok:true,why:'Flats are on the shoe list.'},
  loafers:{cat:'shoes',name:'Loafers',ok:true,why:'Loafers are on the shoe list.'},
  boots:{cat:'shoes',name:'Dressy Boots',ok:true,why:'Clean, dressy boots are on the shoe list.'},
  sneakers:{cat:'shoes',name:'Sneakers',ok:false,why:'Sneakers are on the "Please avoid" list.'},
  flipFlops:{cat:'shoes',name:'Flip-Flops',ok:false,why:'Flip-flops are overly casual, which is on the "Please avoid" list.'}
};
const ORDER=['top','bottom','shoes'];
const CAT_LABEL={top:'Tops & Dresses',bottom:'Bottoms',shoes:'Shoes'};
const GOOD={top:['dressShirt','blouse','sweater','dress'],bottom:['dressPants','skirt'],shoes:['dressShoes','flats','loafers','boots']};
const BADK={top:['graphicTee','jersey','pajamaTop'],bottom:['jeans','sweatpants','pajamaPants'],shoes:['sneakers','flipFlops']};
const FALL=Object.keys(COLORS).filter(k=>COLORS[k].fall);
const OFF=['neonPink','neonGreen','neonYellow','skyBlue','lavender'];
const ALLC=[...FALL,...OFF];

const piecesOf=o=>[o.top,o.bottom,o.shoes].filter(Boolean);
const ROUNDS=[
  {name:'Ava',skin:'#8D5524',hair:'#1E120B',style:'puffs',goal:'Ava loves cozy clothes. Give her a sweater.',
   must:[['sweater','mustard'],['sweater','neonPink'],['pajamaTop','forest']],
   check:o=>o.top&&o.top.kind==='sweater'?{ok:true,msg:'Ava got her cozy sweater.'}:{ok:false,msg:'Ava asked for a sweater. Look in Tops & Dresses.'}},
  {name:'Leo',skin:'#F1C9A5',hair:'#8A4B22',style:'short',goal:'Leo\'s favorite color is forest green. Put forest green somewhere in his outfit.',
   must:[['dressShirt','forest'],['jersey','neonGreen'],['loafers','forest']],
   check:o=>piecesOf(o).some(p=>p.color==='forest')?{ok:true,msg:'Forest green is in Leo\'s outfit.'}:{ok:false,msg:'Leo wants forest green in his outfit. Neon green and olive green are different colors.'}},
  {name:'Ezra',skin:'#C68642',hair:'#2A1B12',style:'curly',fix:{top:['dressShirt','rust'],bottom:['dressPants','brown'],shoes:['sneakers','olive']},
   goal:'Uh-oh! Something in Ezra\'s outfit breaks the dress code. Find it and fix it.',
   must:[['loafers','brown'],['boots','burgundy']],
   check:()=>({ok:true,msg:'Ezra\'s outfit is fixed.'})},
  {name:'Sofia',skin:'#E0AC69',hair:'#3B2314',style:'long',goal:'Sofia wants to wear a skirt with flats.',
   must:[['skirt','burgundy'],['skirt','neonPink'],['flats','cream'],['flipFlops','beige']],
   check:o=>{const s=o.bottom&&o.bottom.kind==='skirt',f=o.shoes&&o.shoes.kind==='flats';
     return s&&f?{ok:true,msg:'Sofia got her skirt and flats.'}:{ok:false,msg:'Sofia still needs '+[!s&&'a skirt',!f&&'flats'].filter(Boolean).join(' and ')+'.'}}},
  {name:'Mateo',skin:'#A86B3C',hair:'#1B1209',style:'short',goal:'Mateo wants every piece of his outfit to be a different fall color.',
   must:[['sweater','olive'],['dressPants','brown'],['loafers','burgundy']],
   check:o=>{const c=piecesOf(o).map(p=>p.color);return new Set(c).size===c.length?{ok:true,msg:'Every piece is a different color.'}:{ok:false,msg:'Two pieces are the same color. Mateo wants each one to be different.'}}},
  {name:'Hana',skin:'#F3D2B3',hair:'#120C08',style:'bun',fix:{top:['blouse','neonPink'],bottom:['skirt','cream'],shoes:['flats','burgundy']},
   goal:'Hana\'s outfit has a problem. Find the piece that breaks the dress code and fix it.',
   must:[['blouse','rust'],['sweater','beige']],
   check:()=>({ok:true,msg:'Hana\'s outfit is fixed.'})},
  {name:'Grace',skin:'#5C3A21',hair:'#0F0A07',style:'long',goal:'Grace wants to wear a dress and boots.',
   must:[['dress','mustard'],['dress','neonYellow'],['boots','brown'],['sneakers','brown']],
   check:o=>{const d=o.top&&o.top.kind==='dress',b=o.shoes&&o.shoes.kind==='boots';
     return d&&b?{ok:true,msg:'Grace got her dress and boots.'}:{ok:false,msg:'Grace still needs '+[!d&&'a dress',!b&&'boots'].filter(Boolean).join(' and ')+'.'}}},
  {name:'Omar',skin:'#C99566',hair:'#1A120C',style:'short',goal:'Omar wants a calm look. Use only cream, beige, and brown.',
   must:[['dressShirt','cream'],['dressPants','beige'],['dressShoes','brown'],['sweater','brown']],
   check:o=>piecesOf(o).every(p=>['cream','beige','brown'].includes(p.color))?{ok:true,msg:'Only cream, beige, and brown. Nice and calm!'}:{ok:false,msg:'Omar only wants cream, beige, and brown. One piece is a different color.'}},
  {name:'Nia',skin:'#7A4A2A',hair:'#1A0F08',style:'puffs',fix:{top:['graphicTee','mustard'],bottom:['dressPants','olive'],shoes:['loafers','brown']},
   goal:'Tricky one! Nia\'s outfit is all fall colors, but something still breaks the dress code. Fix it.',
   must:[['blouse','cream'],['sweater','mustard']],
   check:()=>({ok:true,msg:'Nia\'s outfit is fixed.'})},
  {name:'Theo',skin:'#F5D0B0',hair:'#C98A3E',style:'curly',goal:'Theo wants dress pants, and his shoes must be the same color as his pants.',
   must:[['dressPants','burgundy'],['dressShoes','burgundy'],['dressPants','brown'],['boots','brown']],
   check:o=>{if(!(o.bottom&&o.bottom.kind==='dressPants'))return{ok:false,msg:'Theo asked for dress pants.'};
     return o.shoes&&o.shoes.color===o.bottom.color?{ok:true,msg:'Theo\'s shoes match his pants.'}:{ok:false,msg:'Theo\'s shoes need to be the same color as his pants.'}}}
];

/* ---------- helpers ---------- */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=amt<0?0:255,p=Math.abs(amt);
  r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
function light(hex){const n=parseInt(hex.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150}
function mk(kind,color){if(kind==='jeans')color='denim';return{id:kind+'-'+color,kind,color}}
const label=it=>it.kind==='jeans'?'Blue Jeans':COLORS[it.color].name+' '+KINDS[it.kind].name;
const pieceOk=it=>KINDS[it.kind].ok&&!!COLORS[it.color].fall;
function colorMsg(it){const c=COLORS[it.color];if(it.kind==='jeans')return'';
  if(c.fall)return c.name+' is a warm fall color.';
  if(c.neon)return c.name+' is a neon color, and neon colors are on the "Please avoid" list.';
  return c.name+' is not one of the fall colors.'}
function pieceMsg(it){const k=KINDS[it.kind];if(pieceOk(it))return k.why+' '+colorMsg(it);
  const parts=[];if(!k.ok)parts.push(k.why);
  if(it.kind!=='jeans'){if(!COLORS[it.color].fall)parts.push(colorMsg(it));else if(!k.ok)parts.push('The color is fine, but this kind of clothing is not.')}
  return parts.join(' ')}

let actx=null,muted=false;
function tone(freqs,dur){if(muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
  const t=actx.currentTime+i*dur;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur*1.6);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur*1.8)})}catch(e){}}

function buildCloset(r){
  const sizes={top:8,bottom:6,shoes:6},out={top:[],bottom:[],shoes:[]},seen=new Set();
  const add=it=>{if(seen.has(it.id))return false;seen.add(it.id);out[KINDS[it.kind].cat].push(it);return true};
  (r.must||[]).forEach(([k,c])=>add(mk(k,c)));
  if(r.fix)Object.values(r.fix).forEach(([k,c])=>add(mk(k,c)));
  for(const cat of ORDER){
    let guard=0,flip=out[cat].filter(pieceOk).length<=out[cat].length/2;
    while(out[cat].length<sizes[cat]&&guard++<300){
      let it;
      if(flip)it=mk(rnd(GOOD[cat]),rnd(FALL));
      else if(Math.random()<.55)it=mk(rnd(BADK[cat]),rnd(ALLC));
      else it=mk(rnd(GOOD[cat]),rnd(OFF));
      if(add(it))flip=!flip;
    }
    shuffle(out[cat]);
  }
  return out;
}

}
function check(){
  const r=ROUNDS[S.round],o=S.outfit,isDress=o.top&&o.top.kind==='dress';
  const missing=[];
  if(!o.top)missing.push('a top or a dress');
  if(!isDress&&!o.bottom)missing.push('a bottom');
  if(!o.shoes)missing.push('shoes');
  if(missing.length){S.fb={missing};tone([392],.1);renderGame();return}
  S.tries++;
  const rows=piecesOf(o).map(it=>({it,ok:pieceOk(it),msg:pieceMsg(it)}));
  const goal=r.check(o);
  const ok=rows.every(x=>x.ok)&&goal.ok;
  let stars=0;
  if(ok){stars=S.tries===1?3:S.tries===2?2:1;S.results[S.round]={stars,outfit:{...o}};updateStars();tone([523,659,784,1047],.11)}
  else tone([330,262],.15);
  S.fb={rows,goal,ok,stars};
  renderGame();
  if(ok)leaves();
}
function showFeedback(fb){
  const stage=document.getElementById('stage');
  const el=document.createElement('div');el.className='fb';el.setAttribute('role','dialog');el.setAttribute('aria-label','Music Teacher feedback');
  if(fb.missing){
    el.innerHTML=`<h3>🎵 Not quite ready!</h3><p>Every student needs ${fb.missing.join(', ').replace(/, ([^,]*)$/,' and $1')}. Look in the closet tabs.</p><button class="btn" type="button" id="fbClose">Back to the closet</button>`;
  }else{
    const last=S.round===ROUNDS.length-1;
    el.innerHTML=`<h3>🎵 ${fb.ok?'Concert-ready!':'Music Teacher says…'}</h3>
      ${fb.ok?`<div class="bigstars" aria-label="${fb.stars} stars">${'★'.repeat(fb.stars)}<span class="off">${'★'.repeat(3-fb.stars)}</span></div>`:'<p style="margin:0">Read each note. Fix the pieces with an ✗.</p>'}
      <ul class="rows">${fb.rows.map(x=>`<li class="row ${x.ok?'ok':'no'}">${thumb(x.it)}<div><span class="mark">${x.ok?'✓':'✗'} ${label(x.it)}</span><p>${x.msg}</p></div></li>`).join('')}
        <li class="row ${fb.goal.ok?'ok':'no'}"><span class="gi" style="font-size:1.5rem;text-align:center">${fb.goal.ok?'😊':'🤔'}</span><div><span class="mark">${fb.goal.ok?'✓':'✗'} ${ROUNDS[S.round].name}'s request</span><p>${fb.goal.msg}</p></div></li></ul>
      ${fb.ok?`<button class="btn green" type="button" id="fbNext">${last?'See my results':'Next student →'}</button>`:`<button class="btn" type="button" id="fbClose">Try again</button>`}`;
  }
  stage.appendChild(el);
  const c=el.querySelector('#fbClose');if(c){c.onclick=()=>{S.fb=null;renderGame()};c.focus()}
  const n=el.querySelector('#fbNext');if(n){n.onclick=()=>{S.fb=null;if(S.round<ROUNDS.length-1){S.round++;loadRound()}else endScreen()};n.focus()}
}
function leaves(){
  const stage=document.getElementById('stage');if(!stage)return;
  const cols=FALL.slice(0,7).map(k=>COLORS[k].hex);
  for(let i=0;i<22;i++){const l=document.createElement('span');l.className='leaf';
    l.style.left=(Math.random()*95)+'%';l.style.background=rnd(cols);l.style.animationDuration=(1.6+Math.random()*1.6)+'s';l.style.animationDelay=(Math.random()*.6)+'s';
    stage.appendChild(l);setTimeout(()=>l.remove(),4000)}
}
function endScreen(){
  const t=totalStars(),max=ROUNDS.length*3;
  const msg=t>=27?'Wow! You read the dress code like a pro.':t>=20?'Great styling! You followed the dress code carefully.':'You dressed every student. Keep reading those labels closely!';
  app.innerHTML=`<section class="panel cert">
    <span class="eyebrow" style="color:var(--accent)">Grandparents Day Performance</span>
    <div class="who">${S.name?S.name.replace(/</g,'&lt;'):'You'}</div>
    <h2>Concert-Ready Stylist</h2>
    <p class="bigstars" style="margin:10px 0 2px">★ ${t} / ${max}</p>
    <p>${msg}</p>
    <div class="gallery">${ROUNDS.map((r,i)=>{const res=S.results[i];return`<div class="gcard">${figure(r,res?res.outfit:{})}<b>${r.name}</b><span class="s">${'★'.repeat(res?res.stars:0)}</span></div>`}).join('')}</div>
    <div class="checkrow" style="justify-content:center;max-width:420px;margin:18px auto 0"><button class="btn" type="button" id="againBtn">Play again</button></div>
  </section>`;
  tone([523,659,784,659,1047],.14);
  document.getElementById('againBtn').onclick=startScreen;
  window.scrollTo({top:0,behavior:'smooth'});
}
startScreen();
</script>
